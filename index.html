<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Online Job Portal connects job seekers and employers to help people find their next opportunity.">
  <title>Online Job Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <p class="brand"><span class="brand-mark" aria-hidden="true">JP</span> Online Job Portal</p>
      <nav aria-label="Main navigation">
        <a href="#find-jobs">Find Jobs</a>
        <!-- Account links are placeholders until those pages are implemented. -->
        <a role="link" aria-disabled="true">Login</a>
        <a class="sign-up" role="link" aria-disabled="true">Sign Up</a>
      </nav>
    </div>
  </header>

  <main class="container" id="find-jobs">
    <section class="hero" aria-labelledby="hero-heading">
      <h1 id="hero-heading">Find Your Next Opportunity</h1>
      <p class="description">Connect with employers and discover opportunities that match your skills and interests. Take the next step in your career.</p>
      <div class="search-controls">
        <div class="search-field">
          <label for="job-search">Job title or keyword</label>
          <input type="search" id="job-search" placeholder="e.g. Frontend developer">
        </div>
        <!-- Static starter: this button does not submit or run a search. -->
        <button type="button">Search Jobs</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">Online Job Portal &middot; CS 312 project</div>
  </footer>
</body>
</html>
